name: Windows validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:electron
      # Native input needs an unlocked interactive session: run npm run test:windows manually.
      - run: npm run dist -- --x64 -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v4
        with:
          name: Caprii-Windows-x64
          path: dist/Caprii-Agent-Setup-*.exe
