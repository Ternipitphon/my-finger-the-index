name: Build Caprii integration for Windows
on:
  push:
    branches: [capricore-1.2.2-caprii-1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caprii-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Restore the pinned Windows desktop runtime
        run: >-
          node --input-type=module -e "import { ensureElectronRuntime } from './packages/installer/src/electron-runtime.mjs'; import { runCommand } from './packages/installer/src/commands.mjs'; await ensureElectronRuntime(process.cwd(), { command: runCommand });"
      - run: npm run check -- --require-python
      - run: npm test
      - run: npm run format:check
      - run: npm run release:check
      - run: npm run verify:languages
      - run: node tools/verify/verify-settings-lifecycle.mjs
      - run: npm run verify:installer -- --locales=en,th
      - name: Build the original Windows installer with the integration
        run: npm run release:installer
      - name: Prepare matching source and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = node tools/release/source-export.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed' }
          $build = Get-ChildItem release -Directory -Filter 'installer-1.2.2-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $staging = Join-Path $PWD 'release/publish'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item (Join-Path $build.FullName 'CapriSetup-1.2.2.exe') $staging
          Copy-Item (Join-Path $build.FullName 'BUILD_MANIFEST.json') $staging
          Compress-Archive -Path (Join-Path $source.destination '*') -DestinationPath (Join-Path $staging 'Capri-1.2.2-source.zip')
          Get-ChildItem $staging -File | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content (Join-Path $staging 'SHA256SUMS.txt')
      - name: Publish only after verification and build succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2.2-caprii.1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not replace published binaries' }
          gh release create $tag --target $env:GITHUB_SHA --title 'Capri 1.2.2 + Caprii' --notes-file docs/caprii-release-notes.txt --prerelease release/publish/CapriSetup-1.2.2.exe release/publish/Capri-1.2.2-source.zip release/publish/BUILD_MANIFEST.json release/publish/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
