name: Caprii original desktop with improved task execution
on:
  push:
    branches: [caprii-0.8.7]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caprii-087-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: caprii
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: npm ci
      - run: node scripts/stamp-build.cjs
      - run: npm test
      - run: npm run test:lab
      - run: npm run test:electron
      - run: npm run test:talk-ui
      - name: Verify native context menu and capture preview
        run: npm run test:menu
        env:
          CAPRII_MENU_PREVIEW: '1'
      - run: npm run test:dom-ui
      - run: npm run test:media-ui
      - run: npm run test:media-transport
      - run: npm run test:lab-ui
      - name: Recreate the original pinned public-reader runtime
        run: python scripts/prepare-agent-reach.py
      - name: Verify the bundled reader starts without network or account access
        run: >-
          node -e "require('./src/main/agent-reach').createReach().status(AbortSignal.timeout(15000)).then(r=>console.log(JSON.stringify(r))).catch(e=>{console.error(e.message);process.exitCode=1})"
      - name: Build the original Windows installer
        run: npx --no-install electron-builder --win --x64 --publish never '--config.win.signAndEditExecutable=false'
      - name: Export only tracked source and matching provenance
        run: node scripts/export-release.cjs
      - name: Prepare release files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'release'
          Copy-Item 'dist/Caprii-Agent-Setup-0.8.7.exe' $release
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $release 'source'), (Join-Path $release 'Caprii-0.8.7-source.zip'), [IO.Compression.CompressionLevel]::Optimal, $false)
          Copy-Item 'BUILD-INFO.json' $release
          Copy-Item 'artifacts/menu-preview.png' (Join-Path $release 'Caprii-0.8.7-menu.png')
          Get-ChildItem $release -File | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content (Join-Path $release 'SHA256SUMS.txt')
      - name: Publish a verified installer without replacing existing binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.8.7 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; keep published downloads immutable.' }
          $release = Join-Path $env:GITHUB_WORKSPACE 'release'
          gh release create v0.8.7 --target $env:GITHUB_SHA --title 'Caprii 0.8.7 — organized native context menu' --notes-file RELEASE-NOTES-0.8.7.txt (Join-Path $release 'Caprii-Agent-Setup-0.8.7.exe') (Join-Path $release 'Caprii-0.8.7-source.zip') (Join-Path $release 'BUILD-INFO.json') (Join-Path $release 'SHA256SUMS.txt') (Join-Path $release 'Caprii-0.8.7-menu.png')
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
